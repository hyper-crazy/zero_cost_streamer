name: zero_cost_streamer
description: "A professional Flutter streaming app with TMDB integration."
publish_to: 'none'

version: 2.2.0+7

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State & Data Management
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2
  flutter_dotenv: ^6.0.1

  # Networking & Media
  http: ^1.6.0
  cached_network_image: ^3.4.1
  youtube_player_flutter: ^9.1.1

  # Webview & URL Handling
  webview_flutter: ^4.13.1
  flutter_inappwebview: ^6.1.5
  flutter_inappwebview_windows: ^0.6.0
  url_launcher: ^6.3.2

  # UI & Utilities
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.1.1
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

# --- LAUNCHER ICONS CONFIGURATION ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/zs_logo_transparent bg.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/zs_logo_transparent bg.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/