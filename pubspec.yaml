name: zero_cost_streamer
description: "A new Flutter project."
publish_to: 'none'

version: 1.2.1+4

environment:
  sdk: ^3.11.4

dependencies:
  shared_preferences: ^2.2.2
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_inappwebview: ^6.1.5
  cached_network_image: ^3.4.1
  provider: ^6.1.5+1
  flutter_svg: ^2.3.0
  flutter_dotenv: ^6.0.1
  google_fonts: ^8.1.0
  webview_flutter: ^4.13.1
  url_launcher: ^6.3.2
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_launcher_icons: "^0.13.1"
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# --- LAUNCHER ICONS CONFIGURATION ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/zs_logo_transparent bg.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/zs_logo_transparent bg.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/TMDB_attribution.svg
    - assets/images/Home Screen.jpg
    - assets/images/Content Details.jpg
    - assets/images/Episode Selection.jpg
    - assets/images/zs_logo_white bg.png
    - assets/images/zs_logo_transparent bg.png