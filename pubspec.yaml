name: zero_cost_streamer
description: "A professional Flutter streaming app with TMDB integration."
publish_to: 'none'

version: 2.3.0+9

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State & Data Management
  provider: ^6.1.5+1
  shared_preferences: ^2.2.2
  flutter_dotenv: ^6.0.1

  # Networking & Media Processing
  http: ^1.6.0
  cached_network_image: ^3.4.1
  youtube_player_flutter: ^9.1.1

  # Webview & URL Handling (Cross-Platform)
  webview_flutter: ^4.13.1
  flutter_inappwebview: ^6.1.5
  flutter_inappwebview_windows: ^0.6.0
  url_launcher: ^6.3.2

  # UI Components & System Utilities
  google_fonts: ^8.1.0
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.1.1
  visibility_detector: ^0.4.0+2
  firebase_core: ^4.9.0
  firebase_database: ^12.4.1
  package_info_plus: ^10.1.0
  dio: ^5.9.2
  path_provider: ^2.1.5
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Package for generating native launcher icons
  flutter_launcher_icons: "^0.13.1"

# --- LAUNCHER ICONS CONFIGURATION ---
# Generates icons for Android, iOS, and Windows Desktop
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/zs_logo_transparent bg.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/zs_logo_transparent bg.png"
  # Windows specific configuration for .ico generation
  windows:
    generate: true
    image_path: "assets/images/zs_logo_transparent bg.png"
    icon_size: 256

flutter:
  uses-material-design: true

  # Assets and Environment folder registration
  assets:
    - .env
    - assets/images/